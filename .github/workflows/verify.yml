name: Verify SAND preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:desktop
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - name: Source dependency SBOM (not a signed binary SBOM)
        run: npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: preview-verification
          path: |
            artifacts/local/e2e-results.json
            artifacts/local/*.png
            sbom.json
          if-no-files-found: warn
# Live provider credentials are deliberately absent on PRs. Staging must explicitly
# enable live inference contracts. This workflow does not publish or sign releases.
